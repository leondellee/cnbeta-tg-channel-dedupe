name: cnbeta-dedupe

on:
  schedule:
    # 兜底：每天三场（北京时间 09:20 / 13:20 / 19:20，UTC 01:20 / 05:20 / 11:20）。
    #
    # 主力触发不靠它：cloudflare-cron/ 里的 Worker 每 5 分钟调一次 workflow_dispatch，
    # 因为 GitHub 自己的 schedule 对免费账号节流严重——实测同账号另一个仓库写 */5，
    # 真实间隔中位数 4.7 小时。留着这三场是为了 Worker 万一挂了还能收到消息。
    - cron: '20 1,5,11 * * *'
  workflow_dispatch: {}      # 手动触发 / 供 Worker 调用

# 同一时间只跑一个，避免并发导致重复推送 / state 冲突
concurrency:
  group: cnbeta-dedupe
  cancel-in-progress: false

# 需要写权限才能把去重状态提交回仓库
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 零第三方依赖，无需 pip install
      - name: Aggregate & push
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 云端直连 Telegram，无需代理
          TG_PROXY: ''
        run: python src/service.py

      # 即使用例中途失败，也要把已发送的记账落盘，否则下轮会重发
      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "状态无变化"
            exit 0
          fi
          git commit -m "chore: update dedupe state [skip ci]"
          # 极端情况下远程有新提交（手动改动），rebase 后再推
          git pull --rebase --autostash origin main || true
          git push
