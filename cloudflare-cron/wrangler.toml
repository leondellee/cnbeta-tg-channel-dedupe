name = "cnbeta-dedupe-cron"
main = "worker.js"
compatibility_date = "2026-10-01"

# 每 30 分钟触发一次 GitHub Actions。
#
# 为什么不是 */5：仓库是 Private，Actions 按分钟计费，且**不足 1 分钟按 1 分钟算**。
#   */5  → 288 次/天 × 1 分钟 = 8,640 分钟/月，Free 计划只有 2,000，约 7 天就停摆
#   */30 →  48 次/天 × 1 分钟 = 1,440 分钟/月，加兜底三场约 1,530，留 23% 余量
#
# 想恢复 5 分钟有两条路：仓库改回 Public（公开仓库不计分钟），
# 或把抓取推送整体搬到 Worker（不再跑 Actions）。
[triggers]
crons = ["*/30 * * * *"]
