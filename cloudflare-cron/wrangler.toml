name = "cnbeta-dedupe-cron"
main = "worker.js"
compatibility_date = "2026-10-01"

# 每 5 分钟触发一次 GitHub Actions。
# Cloudflare 的 cron 是秒级准时的，不像 GitHub 自带的 schedule 会被节流到几小时一次。
# 免费额度：10 万请求/天，一趟只发 1~2 个 HTTP 请求，一天 288 次，远没到线。
#
# ⚠️ 前提：仓库必须保持 Public。
# 私有仓库的 Actions 按分钟计费，且不足 1 分钟也按 1 分钟算：
#   */5 → 288 次/天 × 1 分钟 × 30 天 = 8,640 分钟/月，Free 计划仅 2,000，
#   约 7 天耗尽后工作流直接停摆（不是变慢）。
# 如果要转成 Private，请先把这里的 cron 改成 */30（1,440 分钟/月）。
[triggers]
crons = ["*/5 * * * *"]
